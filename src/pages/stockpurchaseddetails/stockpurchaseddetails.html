<ion-header>

  <ion-navbar color="primary">
    <ion-title>Stock Purchased Details</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding class="ion-content-body">

  <div class="ion-item-body">
    <ion-item class="ion-item-item">
      <div class="body">
        <h2 class="title">{{Leave_Type}}</h2>
        <h4 class="status">{{Status}}</h4>
      </div>
      <div class="content">
        <div class="row">
        <div class="col col-title">Approver:</div>
        <div class="col col-details">{{Approver}}</div>
        </div>
        <!-- <div class="row">
        <div class="col col-title">Department:</div>
        <div class="col col-details">{{Project_Name}}</div>
        </div> -->
        <div class="row">
        <div class="col col-title">DO:</div>
        <div class="col col-details">{{Leave_Type}}</div>
        </div>
        <div class="row">
        <div class="col col-title">Start Date:</div>
        <div class="col col-details">{{Start_Date}}</div>
        </div>
        <div class="row">
        <div class="col col-title">End Date:</div>
        <div class="col col-details">{{End_Date}}</div>
        </div>
        <div class="row">
        <div class="col col-title">Reason:</div>
        <div class="col col-details">{{Reason}}</div>
        </div>
      </div>
    </ion-item>         
  </div>

  <ion-grid>
    <ion-row center>
      <ion-col text-center>
        <button ion-button round [navPush]='StockpurchasedreceivePage' [navParams]='req'>Scan SR</button>
        <button ion-button round [navPush]='GensetreplacementmodalPage' [navParams]='req'>Replacement</button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid style="width: 100%">
    <div class="ion-item-body">
      <ion-item class="ion-item-item">
        <ion-row>
            <ion-col col-3>Item</ion-col>
            <ion-col col-3><div text-center>Quantity</div></ion-col>
        </ion-row>
        <!-- <ion-row *ngFor="let detail of advancedetails"> -->
        <ion-row>
            <ion-col col-3>PDC Plate</ion-col>
            <ion-col col-3><ion-label text-center>9</ion-label></ion-col>
        </ion-row>
      </ion-item>
    </div>
  </ion-grid>


</ion-content>
