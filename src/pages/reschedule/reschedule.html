  Ionic pages and navigation.

<ion-header>
  <ion-navbar>
    <ion-title>Reschedule</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>

  <ion-row>
    <div class="customer-details">
      <ion-row>
        <ion-col text-center>
          <h6 no-margin>{{Company_Name}}</h6>
          <h6 no-margin>{{PIC_name}} , {{PIC_no}}</h6>
        </ion-col>
      </ion-row>
    </div>
  </ion-row>

  <form novalidate (ngSubmit)="submit()" [formGroup]="signupForm">
    <ion-grid>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Title</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert title</p>
          </ion-label>
          <ion-input type="text" placeholder="State Title" formControlName="Title" [(ngModel)]="Title"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Appointment Date</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please select appointment date</p>
          </ion-label>
          <ion-datetime pickerFormat="DD MMM YYYY" displayFormat="DD MMM YYYY" placeholder="Choose Appointment Date" max="2200" formControlName="Date" [(ngModel)]="Date" placeholder="{{Date}}"></ion-datetime>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Appointment Time</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please select appointment time</p>
          </ion-label>
          <ion-datetime pickerFormat="hh:mm A" displayFormat="hh:mm A" placeholder="Choose Appointment Time" formControlName="Time" [(ngModel)]="Time" placeholder="{{Time}}"></ion-datetime>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Appointment Place</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please select appointment place</p>
          </ion-label>
          <ion-input type="text" placeholder="State Appointment Place" formControlName="Location" [(ngModel)]="Location"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Remarks</ion-label>
          <ion-textarea type="text" rows="3" placeholder="State Remarks Here" formControlName="Remarks" [(ngModel)]="Remarks"></ion-textarea>
        </ion-item>
      </ion-row>

      <ion-row>
        <button [disabled]="signupForm.invalid" ion-button block >Reschedule</button>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="cancel()">Cancel</button>
      </ion-row>

    </ion-grid>
  </form>

</ion-content>
