<ion-header>
  <ion-navbar color="primary">
    <ion-title style="font-size: 12px; color:inherit" >Logout</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding class="ion-content-body">
  <div class="img" margin-top>
    <button class="round-button button2">
      <img width="100px" height="100px" src="assets/imgs/logo1.png" />
    </button>
  </div>

  <p text-center margin-top>Are you sure you want to logout?</p>

  <button ion-button color="danger" block (click)="logout()" [disabled]="busy">Logout</button>
  <button ion-button color="light" block (click)="cancel()" [disabled]="busy">Cancel</button>
</ion-content>
