<ion-header>

    <ion-navbar color="primary">
      <ion-title>Logistic Request Confirmation</ion-title>
    </ion-navbar>
  
  </ion-header>
  
  
  <ion-content padding class="ion-content-body">
    <div  class="ion-item-body">
      <ion-item *ngFor='let i of items' class="ion-item-item1" text-wrap>
        <ion-label style="opacity: 1!important;">{{i.model}} - {{i.name}} {{i.barcode}} Qty : {{i.qty}} </ion-label>
        <ion-checkbox checked="true" disabled="true" [checked]='i.checked'></ion-checkbox>
      </ion-item>
    </div>
    <ion-item [hidden]='hide'>
      <ion-label>Qty:</ion-label>
      <ion-input type='number' [(ngModel)]='qty'></ion-input>
      <button ion-button small color='light' (click)='add()' item-end><ion-icon name="add" class='add-icon'></ion-icon></button>
      <button ion-button small color='danger' (click)='minus()' item-end><ion-icon name="remove"></ion-icon></button>
    </ion-item>
  
    <ion-row center>
        <ion-col text-center>
            <button ion-button round (click)='addConfirmItem()'>
              Add
            </button>
          </ion-col>
      </ion-row>
  
    <ion-row center>
      <ion-col text-center>
          <button ion-button round icon-start (click)="qrCode()"><ion-icon  name="qr-scanner"></ion-icon>
            Scan
          </button>
        </ion-col>
    </ion-row>
  </ion-content>
  <ion-footer>
    <button ion-button full (click)='submit()'>Confirm</button>
  </ion-footer>
