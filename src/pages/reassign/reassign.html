    <ion-title>Reassign</ion-title>

  <ion-row>
    <div class="customer-details">
      <ion-row>
        <ion-col text-center>
          <h6 no-margin>{{Title}}</h6>

          <h6 no-margin>{{PIC_name}} , {{PIC_no}}</h6>
          <h6 no-margin>{{appointment_date}}</h6>
          <h6 no-margin>{{Time}}</h6>
        </ion-col>
      </ion-row>
    </div>
  </ion-row>
