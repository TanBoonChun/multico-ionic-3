<ion-header>

  <ion-navbar color="primary">
    <ion-title>Vehicle Transfer</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding class="ion-content-body">
  <div class="ion-item-body">
    <ion-item *ngIf="type == 'Transfer'">
      <ion-label color='primary' stacked>Transfer To</ion-label>
      <ionic-selectable item-content [(ngModel)]="UserId2"  itemValueField="Id" [items]="allUsers" [canSearch]="true" itemTextField="Name" (onSearch)="searchUser($event)">
      </ionic-selectable>
    </ion-item>
    <ion-item>
      <ion-label color='primary' stacked>Remarks</ion-label>
      <ion-input [(ngModel)]="Remarks"></ion-input>
    </ion-item>

    <button ion-button full (click)='submit()'>Submit</button>
    <button ion-button full (click)='closeModal()' class="red">Cancel</button>
  </div>
</ion-content>
