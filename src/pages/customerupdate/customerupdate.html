<ion-header>
  <ion-navbar>
    <ion-title>Update Customer</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>

  <!-- <form> -->
    
    <ion-grid>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Status</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert status</p>
          </ion-label>
          <ion-select placeholder="please select" [(ngModel)]="Status" >
            <!-- <ion-option *ngFor="let a of act" >{{a.name| aa}}</ion-option> -->
            <!-- <ion-option value="">Active</ion-option> -->
            <ion-option value="">Active</ion-option>
            <ion-option value="Inactive">Inactive</ion-option>

          </ion-select>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Company Name</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">This field is required</p>
          </ion-label>
          <ion-input type="text" placeholder="State Company Name" [(ngModel)]="CO_Name">{{CO_Name}}</ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>ROC</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">This field is required</p>
          </ion-label>
          <ion-input type="text" placeholder="Please insert ROC" [(ngModel)]="CO_No"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Office No</ion-label>
          <ion-label no-margin no-lines>
            <!-- <p class="error">Please insert office no</p> -->
          </ion-label>
          <ion-input type="text" placeholder="State Office No" [(ngModel)]="Office_No"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Fax No</ion-label>
          <ion-label no-margin no-lines>
            <!-- <p class="error">Please insert fax no</p> -->
          </ion-label>
          <ion-input type="text" placeholder="State Fax No" [(ngModel)]="Fax_No"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Email</ion-label>
          <ion-label no-margin no-lines>
            <!-- <p class="error">Please insert email</p> -->
          </ion-label>
          <ion-input type="text" placeholder="State Email" [(ngModel)]="Email"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Address</ion-label>
          <ion-label no-margin no-lines>
            <!-- <p class="error">Please insert address</p> -->
          </ion-label>
          <ion-input type="text" placeholder="State Address No" [(ngModel)]="Address"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Remarks</ion-label>
          <ion-textarea type="text" rows="3" placeholder="State Remarks Here" [(ngModel)]="Remarks"></ion-textarea>
        </ion-item>
      </ion-row>

        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Customer Name</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert customer name</p>
          </ion-label>
          <ion-input type="text" placeholder="State Customer Name" [(ngModel)]="CU_Name"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>

          <ion-label no-margin no-lines>
            <p class="error">Please insert company code</p>
          </ion-label>
          <ion-input type="text" placeholder="State Company Code" [(ngModel)]="CO_Code"></ion-input>
        </ion-item>
      </ion-row> -->

      

      

      

      

      

      

      <ion-row>
        <button ion-button block type="button" (click)="submit()">Submit</button>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="cancel()">Cancel</button>
      </ion-row>

    </ion-grid>
  <!-- </form> -->

</ion-content>
