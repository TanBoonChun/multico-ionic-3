<ion-header>

  <ion-navbar color="primary">
    <ion-title>Vehicle Details</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding class="ion-content-body">

  <div class="ion-item-body">
    <ion-item class="ion-item-item">
      <div class="qrcode">
        <qrcode [qrdata]="myAngularxQrCode" [level]="'M'" usesvg="true"></qrcode>
      </div>
      <div class="details" *ngIf="vehicle">
        <h2>Details</h2>
        Vehicle No: {{vehicle.Vehicle_No}}<br>
        Model : {{vehicle.Model}}<br>
        Type : {{vehicle.Type}}<br>
      </div>
    </ion-item>
    <div class="center" *ngIf="vehicle">
      <button ion-button class="success" *ngIf="!vehicle.holder" (click)="openModal('Take')">Take</button>
      <button ion-button class="warning" *ngIf="me && me.UserId == vehicle.holder" (click)="openModal('Return')">Return</button>
      <button ion-button class="danger" *ngIf="me && me.UserId == vehicle.holder" (click)="openModal('Transfer')">Transfer</button>
    </div>
  </div>

  <ion-list>
    <ion-item class="ion-item-item" *ngFor="let trans of transaction">
      <div class="row">
        <div class="left {{trans.Class}}">
          {{trans.Date}}
        </div>
        <div class="right">
          <h2>{{trans.Type}}</h2>
          <p *ngIf="trans.Type == 'Transfer' ">{{trans.Name}} Transfer To {{trans.transfer}}</p>
          <p *ngIf="trans.Type !== 'Transfer' ">{{trans.Name}}</p>
        </div>
      </div>
    </ion-item>
  </ion-list>

</ion-content>
