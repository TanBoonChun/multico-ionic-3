<ion-header>

  <ion-navbar color="primary">
    <ion-title>Vehicle Approval</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding class="ion-content-body">
  <div class="ion-item-body" *ngFor="let approval of approvals" (click)="show(approval)">
    <ion-item class="ion-item-item">
        <h3>{{approval.Type}}</h3>
        <p>Vehicle No : {{approval.Vehicle_No}}</p>
        <p>User : {{approval.Name}}</p>
        <p *ngIf="approval.Type == 'Transfer'">Transfer To : {{approval.transfer}}</p>
    </ion-item>
  </div>
</ion-content>
