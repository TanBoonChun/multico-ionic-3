<ion-header>
  <ion-navbar>
    <ion-title>Update Client</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>

  <!-- <form> -->
    
    <ion-grid>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Status</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert status</p>
          </ion-label>
          <ion-select placeholder="please select" [(ngModel)]="Status">
            <ion-option value="">Active</ion-option>
            <ion-option value="Inactive">Inactive</ion-option>
          </ion-select>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Company</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert company</p>
          </ion-label>
          <ion-select placeholder="{{Company_Name}}" [(ngModel)]="Company">
            <ion-option *ngFor="let c of com" value="{{c.Id}}">{{c.Company_Name}}</ion-option>
          </ion-select>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Customer of</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert customer of</p>
          </ion-label>
          <ion-select placeholder="{{Customer_Of}}" [(ngModel)]="Salesman">
            <ion-option *ngFor="let s of sales" value="{{s.Name}}">{{s.Name}}</ion-option>
          </ion-select>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Contact Person</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert contact name</p>
          </ion-label>
          <ion-input type="text" placeholder="{{PIC_name}}" [(ngModel)]="PIC_name"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Contact No</ion-label>
          <ion-label no-margin no-lines>
            <p class="error">Please insert contact no</p>
          </ion-label>
          <ion-input type="text" placeholder="{{PIC_no}}" [(ngModel)]="PIC_no"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Contact Email</ion-label>
          <!-- <ion-label no-margin no-lines>
            <p class="error">Please insert contact email</p>
          </ion-label> -->
          <ion-input type="text" placeholder="{{PIC_email}}" [(ngModel)]="PIC_email"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Remarks</ion-label>
          <!-- <ion-label no-margin no-lines>
            <p class="error">Please insert remarks</p>
          </ion-label> -->
          <ion-input type="text" placeholder="{{Remarks2}}" [(ngModel)]="Remarks"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="submit()">Submit</button>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="cancel()">Cancel</button>
      </ion-row>

    </ion-grid>
  <!-- </form> -->

</ion-content>
