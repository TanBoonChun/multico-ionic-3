<ion-header>
<ion-navbar>
    <ion-title>Update Schedule</ion-title>
</ion-navbar>
</ion-header>

<ion-content>
    <ion-grid>
        <form novalidate (ngSubmit)="submit()" [formGroup]="signupform">

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Deal</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Need to pick</p>
                </ion-label>
                <!-- <ion-select placeholder="{{Deal_Name2}}" placeholder="please select" [(ngModel)]="Deal" formControlName="Deal_Name">
                    <ion-option *ngFor="let d of deal" value="{{d.DealId}}">{{d.Deal_Name}}</ion-option>
                </ion-select> -->
                <ionic-selectable item-content [(ngModel)]="Deal" [items]="deal" formControlName="Deal_Name" (onChange)="setContactOptions($event)" itemValueField="Id" itemTextField="Deal_Name" [canSearch]="true" [canClear]="true" >
                </ionic-selectable>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Contact Person</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Need to pick</p>
                </ion-label>
                <!-- <ion-select placeholder="{{Contact2}}" [(ngModel)]="Contact"  formControlName="Contact">
                    <ion-option *ngFor="let c of contact" value="{{c.Id}}">{{c.PIC_name}} ({{c.Company_Name}})</ion-option>
                </ion-select> -->
                <ionic-selectable item-content placeholder="{{Contact2}}" [(ngModel)]="Client" [items]="client" formControlName="Client"  itemValueField="Id" itemTextField="PIC_name" [canSearch]="true" [canClear]="true" >
                </ionic-selectable>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Assign To</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Need to pick</p>
                </ion-label>
                <ion-select placeholder="{{Assign2}}" [(ngModel)]="Assign" formControlName="Assign">
                    <ion-option *ngFor="let a of items" value="{{a.Id}}">{{a.Name}}</ion-option>
                </ion-select>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Title</ion-label>
                <!-- <ion-label no-margin no-lines>
                    <p class="error">Please insert title</p>
                </ion-label> -->
                <ion-input type="text" placeholder="{{Title}}" [(ngModel)]="Title" formControlName="Title"></ion-input>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Appointment Date</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Please select appointment date</p>
                </ion-label>
                <ion-datetime pickerFormat="DD MMM YYYY" displayFormat="DD MM YYYY" placeholder="{{Date}}" max="2200" [(ngModel)]="Date" formControlName="Date"></ion-datetime>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Appointment Time</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Need to pick</p>
                </ion-label>
                <ion-datetime pickerFormat="hh:mm A" displayFormat="hh:mm A" placeholder="{{Time}}"  [(ngModel)]="Time" formControlName="Time"></ion-datetime>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Location</ion-label>
                <!-- <ion-label no-margin no-lines>
                    <p class="error">Please select appointment place</p>
                </ion-label> -->
                <ion-input type="text" placeholder="{{Place}}" [(ngModel)]="Place" formControlName="Place"></ion-input>
                </ion-item>
            </ion-row>

            <!-- <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Company</ion-label>
                <ion-select placeholder="Please Select" [(ngModel)]="Company" (ngModelChange)="setClientOptions($event)">
                    <ion-option *ngFor="let com of company" value="{{com.Id}}">{{com.Company_Name}}</ion-option>
                </ion-select>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Client</ion-label>
                <ion-select placeholder="Please Select" [(ngModel)]="Client">
                    <ion-option *ngFor="let c of clientOptions" value="{{c.Id}}">{{c.PIC_name}}</ion-option>
                </ion-select>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Upline</ion-label>
                <ion-select placeholder="Please Select" [(ngModel)]="UplineId" (ngModelChange)="setAssignOptions($event)">
                    <ion-option *ngFor="let a of upline" value="{{a.Id}}">{{a.Name}}</ion-option>
                </ion-select>
                </ion-item>
            </ion-row> -->

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Reason</ion-label>
                <ion-label no-margin no-lines>
                    <p class="error">Please insert reason</p>
                </ion-label>
                <ion-textarea type="text" rows="3" placeholder="{{Reasons}}" [(ngModel)]="Reasons" formControlName="Reasons"></ion-textarea>
                </ion-item>
            </ion-row>

            <ion-row no-margin no-padding>
                <ion-item class="ion-item" no-margin no-padding padding-left>
                <ion-label stacked>Remarks</ion-label>
                <!-- <ion-label no-margin no-lines>
                    <p class="error">Please insert remarks</p>
                </ion-label> -->
                <ion-textarea type="text" rows="3" placeholder="{{Remarks}}" [(ngModel)]="Remarks"  formControlName="Remarks"></ion-textarea>
                </ion-item>
            </ion-row>

            <ion-row>
                <button ion-button block [disabled]="signupform.invalid">Submit</button>
            </ion-row>
        </form>

        <ion-row>
            <button ion-button block type="button" (click)="cancel()">Cancel</button>
        </ion-row>

    </ion-grid>

</ion-content>
