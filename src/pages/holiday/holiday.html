  <div class="item">
    <div id="all">
      <div class="box">
        <section class="month" *ngFor="let group of groups">
          <div>
          <h3 class="month">{{ group }}</h3>
          </div>
          <section>
            <ul class="list">
              <li class="item" *ngFor="let item of items[group]">
                <h5>{{item.Holiday}} ({{ myFunction(item.Start_Date) }})</h5>
                <p class="date">Start: {{item.Start_Date}}</p>
                <p class="date">End: {{item.End_Date}}</p>
              </li>
            </ul>
          </section>
        </section>
      </div>
    </div>
