<ion-header>

  <ion-navbar color="primary">
    <ion-title>Add Item</ion-title>
    <ion-buttons right><button class="invisible"><ion-icon name="close" class="larger" (click)="showConfirm()"></ion-icon></button></ion-buttons>
  </ion-navbar>

</ion-header>

<ion-content padding>
  
  <ion-list>
    <form novalidate (ngSubmit)="submit()" [formGroup]="signupform">

        

      <div class="row">
        <div>
          <h3 left style="color: black;">Advanced Required &nbsp;</h3>
        </div>
      </div>


      <ion-grid>
        <ion-row  nowrap >
          <ion-col col-6></ion-col>
          <ion-col col-6><div style="text-align: center;"></div></ion-col>
        </ion-row>

        <ion-row>
          <ion-col col-6>Material Code/ Description</ion-col>
          <ion-select placeholder="please select" [(ngModel)]="newMaterial" formControlName="newMaterial">
            <ion-option value="1">1</ion-option>
            <ion-option value="2">2</ion-option>
            <ion-option value="3">3</ion-option>
            <ion-option value="4">4</ion-option>
          </ion-select> 
        </ion-row>

        <ion-row>
          <ion-col col-6>Unit
            <ion-select placeholder="please select" [(ngModel)]="newUnit" formControlName="newUnit">
              <ion-option value="1">1</ion-option>
              <ion-option value="2">2</ion-option>
              <ion-option value="3">3</ion-option>
              <ion-option value="4">4</ion-option>
            </ion-select> 
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col col-6>Quantity
            <ion-select placeholder="please select" [(ngModel)]="newQuantity" formControlName="newQuantity">
              <ion-option value="1">1</ion-option>
              <ion-option value="2">2</ion-option>
              <ion-option value="3">3</ion-option>
              <ion-option value="4">4</ion-option>
            </ion-select> 
          </ion-col>
        </ion-row>

      </ion-grid>

      <br>

      <div style="color: red; font-size: x-small;"> *Make sure no negative (-) value</div>

      <br>

      <button ion-button block color="primary" type="submit" [disabled]="signupform.invalid">Submit</button>

    </form>
  </ion-list> 

</ion-content>
