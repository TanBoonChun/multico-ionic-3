<ion-header>
  <ion-navbar>
      <ion-title>Cancel Schedule</ion-title>
  </ion-navbar>
  </ion-header>
  
  <ion-content>
      <ion-grid>
          <form novalidate (ngSubmit)="submitCancel()" [formGroup]="signupform">
  
              <ion-row no-margin no-padding>
                  <ion-item class="ion-item" no-margin no-padding padding-left>
                  <ion-label stacked>Reason</ion-label>
                  <ion-label no-margin no-lines>
                      <p class="error">Please insert reason</p>
                  </ion-label>
                  <ion-textarea type="text" rows="3" placeholder="{{Reasons}}" [(ngModel)]="Reasons" formControlName="Reasons"></ion-textarea>
                  </ion-item>
              </ion-row>
  
              <ion-row>
                  <button ion-button block [disabled]="signupform.invalid">Submit</button>
              </ion-row>
          </form>
  
          <ion-row>
              <button ion-button block type="button" (click)="cancel()">Cancel</button>
          </ion-row>
  
      </ion-grid>
  
  </ion-content>
