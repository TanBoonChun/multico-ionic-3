<ion-header>
  <ion-navbar color="primary">
    <ion-title>My STO</ion-title>

  <div class="ion-item-body">
    <ion-item class="ion-item-item" no-wrap>

      <div class="row" (click)='stoForm()'>
        <div>
          <button class="round-button button1">
            <img src="assets/img/calendar (2).png" height="30px" width="30px">

        </div>
      </div>
      <br>
      <div class="row" (click)='stoStatus()'>

          <button class="round-button button1">
            <img src="assets/img/calendar (2).png" height="30px" width="30px">

          My STO Status
        </div>
      </div>

    </ion-item>
  </div>
