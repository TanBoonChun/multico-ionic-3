<ion-header>

  <ion-navbar color="primary">
    <ion-title>Job Details</ion-title>
    <ion-buttons right>
      <button ion-button icon-only class="close-btn" (click)="showConfirm()">
        <ion-icon name="close"></ion-icon>
      </button>
    </ion-buttons>
  </ion-navbar>

</ion-header>


<ion-content class="ion-content-body">
  <form novalidate (ngSubmit)="submitClaim()" [formGroup]="signupform">

    <!-- ..........................JOB DETAILS.......................... -->
    <div class="card">
      <div class="card-title">
        <ion-icon name="clipboard"></ion-icon>
        <span>Job Details</span>
      </div>

      <ion-list class="form-list">
        <ion-item>
          <ion-label stacked color="primary" class="required">Job / Service Ticket No</ion-label>
          <ionic-selectable item-content [(ngModel)]="Service_Ticket" [items]="serviceTickets"
            formControlName="Service_Ticket" itemValueField="Id" itemTextField="Label" [canSearch]="true"
            [canClear]="true" (onSearch)="searchServiceTickets($event)" [class.error1]="!signupform.controls.Service_Ticket.valid && signupform.controls.Service_Ticket.dirty">
          </ionic-selectable>
        </ion-item>
        <div class="field-error" *ngIf="signupform.get('Service_Ticket').hasError('required') && signupform.get('Service_Ticket').touched">
          Please select the job
        </div>

        <ion-item>
          <ion-label stacked color="primary" class="required">Purpose</ion-label>
          <ion-textarea autocomplete="true" spellcheck="true" rows="3" autoGrow="true" type="text" placeholder="What is the advance for?" [(ngModel)]="Purpose" formControlName="Purpose" [class.error1]="!signupform.controls.Purpose.valid && signupform.controls.Purpose.dirty"></ion-textarea>
        </ion-item>
        <div class="field-error" *ngIf="signupform.get('Purpose').hasError('required') && signupform.get('Purpose').touched">
          Please insert the purpose
        </div>
      </ion-list>
    </div>

    <!-- ..........................AMOUNT.......................... -->
    <div class="card" *ngIf="Need_Advance">
      <div class="card-title">
        <ion-icon name="cash"></ion-icon>
        <span>Advance Amount (RM)</span>
      </div>

      <div class="expense-block">
        <div class="expense-head">
          <span class="expense-label required">Amount</span>
        </div>
        <ion-input class="amount-input" type="number" placeholder="0.00" [(ngModel)]="Amount" formControlName="Amount" [class.error1]="!signupform.controls.Amount.valid && signupform.controls.Amount.dirty">
        </ion-input>
        <div class="field-error" *ngIf="signupform.get('Amount').hasError('required') && signupform.get('Amount').touched">
          Please insert the amount
        </div>
      </div>
    </div>

    <div class="hint-note" *ngIf="Need_Advance">
      <ion-icon name="information-circle"></ion-icon>
      <span>Make sure there is no negative (-) value.</span>
    </div>

    <div class="hint-note" *ngIf="!Need_Advance">
      <ion-icon name="information-circle"></ion-icon>
      <span>Job request only - no advance payment is requested.</span>
    </div>

    <div class="submit-wrap">
      <button ion-button block color="primary" type="submit" [disabled]="signupform.invalid">Submit</button>
    </div>

  </form>
</ion-content>
