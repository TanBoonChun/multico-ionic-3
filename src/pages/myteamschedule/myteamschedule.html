<ion-header>
  <ion-navbar>
    <ion-title>My Team Schedule</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding class="ion-content-body">

  <div class="box" style="direction: ltr;">
    <ion-item class="ion-item" text-wrap>
      <!-- <ion-scroll scrollX="true"> -->

      <div *ngIf="calendarOptions" text-wrap>
        <ng-fullcalendar text-wrap class="fc-view-container" #ucCalendar (eventClick)="eventClick($event.detail)" 
        [options]="calendarOptions"></ng-fullcalendar>
      </div>
      <!-- </ion-scroll> -->
    </ion-item>
  </div>

</ion-content>
