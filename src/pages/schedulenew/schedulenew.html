<ion-header>
  <ion-navbar>
    <ion-title>New Appointment</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>

  <!-- <form> -->
    <ion-grid>
      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Appointment Date<span style="color:red">*</span></ion-label>
          <ion-label no-margin no-lines *ngIf="!isFieldValid('Date') && submitted">
            <p class="error">Please select appointment date</p>
          </ion-label>
          <ion-datetime pickerFormat="DD MMM YYYY" displayFormat="DD MM YYYY" placeholder="Choose Appointment Date" max="2200" [(ngModel)]="Date"></ion-datetime>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Appointment Time</ion-label>
          <ion-datetime pickerFormat="hh:mm A" displayFormat="hh:mm A" placeholder="Choose Appointment Time" max="2200" [(ngModel)]="Time"></ion-datetime>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Location</ion-label>
          <ion-input type="text" placeholder="State Appointment Place" [(ngModel)]="Place"></ion-input>
        </ion-item>
      </ion-row>

      <ion-row no-margin no-padding>
        <ion-item class="ion-item" no-margin no-padding padding-left>
          <ion-label stacked>Remarks</ion-label>
          <ion-textarea type="text" rows="3" placeholder="State Remarks" [(ngModel)]="Remarks"></ion-textarea>
        </ion-item>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="submit()">Submit</button>
      </ion-row>

      <ion-row>
        <button ion-button block type="button" (click)="cancel()">Cancel</button>
      </ion-row>

    </ion-grid>
  <!-- </form> -->

</ion-content>
